<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Math & Markdown 渲染</title>

    <!-- 引入 KaTeX 样式 (数学公式) -->
    <link rel="stylesheet" href="{{pluResPath}}/mathRender/css/katex.min.css">
    <script src="{{pluResPath}}/mathRender/js/katex.min.js"></script>

    <style>
        /* 复用你之前的春樱初绽背景 */
        html {
            background-color: #fff8f8;
            background-image: linear-gradient(135deg, #ffe5e7 0%, #ffeae0 35%, #f4e6ff 70%, #e0ffff 100%);
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100%;
            width: 100%;
            min-width: fit-content;
        }

        body {
            margin: 0;
            background: transparent;
            font-family: "Outfit", "Nunito", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            width: 100%;
            min-width: fit-content;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* 噪点纹理 */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.025;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 截图目标元素：puppeteer 截的是 #container，成品图宽度 = 它的布局宽度 × zoom
           （本渲染器的元素截图路径不读 Viewport / deviceScaleFactor，别指望那两个参数）。
           设计按 1300px 画（卡片 1200 + 左右内距各 50），这里整体 zoom 到 2560px 出图：
           排版与字号比例完全不变，只是像素翻倍到 2K。要改出图宽度只改这一处。 */
        #container {
            padding: 50px;
            width: fit-content;
            position: relative;
            z-index: 1;
            zoom: 1.9692;
        }

        /* 拟态卡片容器 */
        .card {
            width: 1200px;
            /* 基础宽度 */
            min-height: 800px;
            height: auto;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(35px) saturate(140%);
            -webkit-backdrop-filter: blur(35px) saturate(140%);
            border: 1.5px solid rgba(244, 219, 216, 0.85);
            border-radius: 40px;
            padding: 40px 45px 30px 45px;
            box-shadow:
                0 30px 70px -15px rgba(244, 190, 190, 0.25),
                0 15px 35px -20px rgba(0, 0, 0, 0.06),
                inset 0 1.5px 2px rgba(255, 255, 255, 0.9),
                inset 0 -1.5px 3px rgba(244, 219, 216, 0.3);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* macOS 风格标题栏 */
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0 22px 0;
            border-bottom: 1.5px dashed rgba(244, 219, 216, 0.55);
            margin-bottom: 25px;
        }

        .window-buttons {
            display: flex;
            gap: 8px;
            width: 90px;
        }

        .window-buttons .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .window-buttons .btn.close {
            background-color: #ff5f56;
        }

        .window-buttons .btn.minimize {
            background-color: #ffbd2e;
        }

        .window-buttons .btn.maximize {
            background-color: #27c93f;
        }

        .window-title {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .window-title-box {
            background-color: rgba(255, 255, 255, 0.72);
            padding: 6px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255, 180, 190, 0.35);
            box-shadow: 0 6px 15px rgba(255, 143, 163, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        .window-title-text {
            color: #c8a7a4;
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 20px;
        }

        .window-subtitle {
            font-size: 11px;
            font-weight: 800;
            color: #c8a7a4;
            text-transform: uppercase;
            width: 90px;
            text-align: right;
        }

        /* 解决你提到的字体大小问题核心区：直接由这里接管，无需改底层 JS */
        .markdown-body {
            flex: 1;
            /* 当前语义正文色：引用块等语义容器会覆盖这个变量，
               任务列表里「切断父项灰化」的地方引用它，才不会把所在容器的语义色一起丢掉 */
            --text-color: #4a3735;
            color: var(--text-color);
            font-size: 24px;
            /* 基础大字体，适应高清截图 */
            line-height: 1.7;
            padding: 10px 20px;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            color: #ff8fa3;
            border-bottom: 2px dashed rgba(244, 219, 216, 0.5);
            padding-bottom: 10px;
            margin-top: 1.5em;
        }

        /* 段落间距；列表项间距由下面的列表样式单独控制，不在这里给 li 设值，
           免得两条规则特异性相同、靠源码先后决定结果 */
        .markdown-body p {
            margin-bottom: 16px;
        }

        /* 表格：圆角外框 + 浅粉网格线 + 粉色表头，配色沿用主题变量 */
        .markdown-body .table-wrap {
            margin: 28px 0;
            border: 1.5px solid rgba(244, 219, 216, 0.95);
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.55);
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8em;
            /* 正文 24px，表格略小以容纳多列并减少短标签折行 */
            line-height: 1.55;
        }

        .markdown-body thead th {
            background: rgba(255, 229, 231, 0.9);
            color: #d3607c;
            font-weight: 800;
            text-align: left;
            padding: 13px 16px;
            border-bottom: 1.5px solid rgba(244, 219, 216, 0.95);
        }

        .markdown-body tbody td {
            color: var(--text-color);
            padding: 13px 16px;
            vertical-align: top;
            word-break: break-word;
            border-bottom: 1px solid rgba(236, 204, 202, 0.9);
        }

        /* 竖线只画在单元格左侧，避免最后一列多出一条线 */
        .markdown-body thead th + th,
        .markdown-body tbody td + td {
            border-left: 1px solid rgba(236, 204, 202, 0.9);
        }

        /* 外框已经画了底线，最后一行不再重复 */
        .markdown-body tbody tr:last-child td {
            border-bottom: none;
        }

        /* 引用块：主题粉左标 + 半透明白底，圆角语言与表格保持一致 */
        .markdown-body blockquote {
            margin: 24px 0;
            padding: 18px 24px;
            border-left: 5px solid rgba(255, 143, 163, 0.7);
            border-radius: 6px 18px 18px 6px;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 0 1.5px rgba(244, 219, 216, 0.55);
            --text-color: #66504c;
            color: var(--text-color);
        }

        /* 段间距由 p 自己控制，末段不再留白 */
        .markdown-body blockquote > :last-child {
            margin-bottom: 0;
        }

        /* 引用内的加粗用主题粉强调，与正文加粗区分 */
        .markdown-body blockquote strong {
            color: #d3607c;
        }

        /* 嵌套引用：收窄内距并降低底色，避免左侧色条层层叠加 */
        .markdown-body blockquote blockquote {
            margin: 16px 0;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.45);
            --text-color: #7a625d;
            color: var(--text-color);
        }

        /* 标题 h4-h6：h1-h3 之外补齐层级，字号递减、颜色随层级减弱 */
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            color: #d3607c;
            margin-top: 1.4em;
        }

        .markdown-body h4 {
            font-size: 1.1em;
            border-bottom: 1.5px dashed rgba(244, 219, 216, 0.5);
            padding-bottom: 8px;
        }

        .markdown-body h5 {
            font-size: 1em;
        }

        .markdown-body h6 {
            font-size: 0.92em;
            color: #c8a7a4;
        }

        /* 链接：主题粉 + 淡化的下划线，替换浏览器默认蓝 */
        .markdown-body a {
            color: #d3607c;
            text-decoration: underline;
            text-decoration-color: rgba(211, 96, 124, 0.4);
            text-decoration-thickness: 1.5px;
            text-underline-offset: 4px;
        }

        /* 列表：圆点/序号用主题粉，缩进与项间距收紧 */
        .markdown-body ul,
        .markdown-body ol {
            margin: 20px 0;
            padding-left: 1.5em;
        }

        .markdown-body li {
            margin-bottom: 8px;
        }

        .markdown-body li:last-child {
            margin-bottom: 0;
        }

        .markdown-body li::marker {
            color: #ff8fa3;
            font-weight: 700;
        }

        /* 松散列表的列表项自带段落，不再各留 16px */
        .markdown-body li > p {
            margin-bottom: 8px;
        }

        .markdown-body li > p:last-child {
            margin-bottom: 0;
        }

        .markdown-body li > ul,
        .markdown-body li > ol {
            margin: 8px 0;
        }

        /* 任务列表：去掉圆点，复选框由 JS 生成的 span 绘制 */
        .markdown-body li.task-item {
            list-style: none;
        }

        /* 已完成项文字弱化；子列表是独立条目，不能跟着父项一起变灰。
           只在「直接子列表」上切断灰色继承，并且要还原成**当前容器的语义正文色**
           （--text-color：正文区是 #4a3735，引用区是引用自己的颜色），
           不要写死颜色，否则引用块里的完成任务会连带丢掉引用色。 */
        .markdown-body li.task-item.is-done {
            color: #8a7671;
        }

        .markdown-body li.task-item.is-done > ul,
        .markdown-body li.task-item.is-done > ol {
            color: var(--text-color);
        }

        .markdown-body .task-box {
            display: inline-block;
            position: relative;
            vertical-align: -0.1em;
            width: 0.78em;
            height: 0.78em;
            margin-right: 0.45em;
            border: 2px solid rgba(255, 143, 163, 0.9);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.85);
        }

        .markdown-body .task-box.is-done {
            background: rgba(255, 143, 163, 0.9);
        }

        .markdown-body .task-box.is-done::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 45%;
            width: 0.42em;
            height: 0.22em;
            border-left: 2.5px solid #fff;
            border-bottom: 2.5px solid #fff;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* 图片：限宽防溢出，圆角描边与卡片一致；独占一段时居中 */
        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 14px;
            border: 1.5px solid rgba(244, 219, 216, 0.9);
            background: rgba(255, 255, 255, 0.6);
        }

        .markdown-body p > img:only-child {
            display: block;
            margin: 20px auto;
        }

        /* 分隔线：与标题虚线底同语言，替换浏览器默认灰线 */
        .markdown-body hr {
            height: 0;
            margin: 32px 0;
            border: none;
            border-top: 2px dashed rgba(244, 219, 216, 0.85);
        }

        /* 统一代码块和数学块的底色 */
        .markdown-body pre,
        .markdown-body code {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-family: Consolas, Monaco, monospace;
            padding: 4px 8px;
        }

        .markdown-body pre {
            padding: 20px;
            border: 1px solid rgba(244, 219, 216, 0.6);
            overflow-x: auto;
        }

        /* pre 里的 code 会继承行内 code 的内距：行内盒的左内距只作用在行首，
           会让代码块第一行比后续行右移 8px，同时内层多出一块白底 */
        .markdown-body pre code {
            padding: 0;
            background: transparent;
            border-radius: 0;
        }

        /* 数学公式调整：放大显示 */
        .katex-display {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(244, 219, 216, 0.6);
            box-shadow: 0 4px 15px rgba(244, 190, 190, 0.1);
            font-size: 1.25em !important;
            /* 公式比正文更大一点 */
            overflow-x: auto;
            overflow-y: hidden;
        }

        .katex {
            font-size: 1.15em;
        }

        /* 内联公式稍微放大 */

        /* Mermaid 图表居中和美化 */
        .mermaid {
            display: flex;
            justify-content: center;
            margin: 30px 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 20px;
            border: 1px dashed rgba(244, 219, 216, 0.8);
        }

        .footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1.5px dashed rgba(244, 219, 216, 0.55);
            font-size: 14px;
            color: #c8a7a4;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer::before {
            content: "✨";
            margin-right: 8px;
            font-size: 14px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.55;
                transform: scale(0.9) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.15) rotate(15deg);
            }
        }

        #raw-markdown {
            display: none;
        }
    </style>

    <!-- 引入相关处理库 -->
    <!-- 1. Markdown 解析 -->
    <script src="{{pluResPath}}/mathRender/js/markdown-it.min.js"></script>
    <!-- 2. Mermaid 图表作图 -->
    <script src="{{pluResPath}}/mathRender/js/mermaid.min.js"></script>
    <!-- 3. KaTeX 拓展 (由于需要 markdown-it-katex 插件，这里直接引入 CDN 现成版) -->
    <script src="{{pluResPath}}/mathRender/js/index.js"></script>

</head>

<body>
    <div id="container">
        <div class="card" id="render-card">
            <!-- 标题栏 -->
            <div class="window-header">
                <div class="window-buttons"><span class="btn close"></span><span class="btn minimize"></span><span
                        class="btn maximize"></span></div>
                <div class="window-title"><span class="window-title-box"><span
                            class="window-title-text">{{title}}</span></span></div>
                <div class="window-subtitle">Math & Graph</div>
            </div>

            <!-- 正文渲染区 -->
            <div id="content" class="markdown-body"></div>

            <!-- 页脚 -->
            <div class="footer">Created By PaimonChatGPT-Plugin</div>
        </div>
    </div>

    <!-- 原始注入的数据 -->
    <div id="raw-markdown">{{markdown}}</div>

    <script>
        window.onload = function () {
            let rawData = document.getElementById('raw-markdown').innerText || document.getElementById('raw-markdown').textContent;

            // 初始化 Markdown 渲染器，并挂载 KaTeX 插件
            // 注意：window.markdownitKatex 是 @vscode/markdown-it-katex 挂载到全局的变量
            const md = window.markdownit({
                html: true,
                breaks: true,
                linkify: true
            }).use(window.markdownitKatex);

            // 交给 markdown-it 识别完整的 Mermaid fence，再将其转成渲染容器。
            // 不能在 md.render() 前直接用 <div> 替换 fence：Mermaid 代码中的空行会
            // 使后续缩进行被 Markdown 解析成 <pre><code>，最终导致 Mermaid 语法错误。
            const defaultFenceRenderer = md.renderer.rules.fence;
            md.renderer.rules.fence = function (tokens, idx, options, env, self) {
                const token = tokens[idx];
                const language = (token.info || '').trim().split(/\s+/)[0].toLowerCase();

                if (language === 'mermaid') {
                    return '<div class="mermaid">' + md.utils.escapeHtml(token.content) + '</div>\n';
                }

                return defaultFenceRenderer(tokens, idx, options, env, self);
            };

            // 表格外包一层容器，便于统一绘制圆角外框
            const defaultTableOpen = md.renderer.rules.table_open || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
            const defaultTableClose = md.renderer.rules.table_close || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
            md.renderer.rules.table_open = (tokens, idx, options, env, self) => '<div class="table-wrap">' + defaultTableOpen(tokens, idx, options, env, self);
            md.renderer.rules.table_close = (tokens, idx, options, env, self) => defaultTableClose(tokens, idx, options, env, self) + '</div>';

            // markdown-it 默认没有脚注语法：`[^x]` 会命中引用式链接规则，生成一个指向定义文本的
            // 错误相对链接（href 是中文定义内容），定义行也会被 reference 规则吞掉。这里让引用和
            // 定义都退回普通文本，宁可原样显示，也不产出假链接、不静默丢内容。
            // label 只排除 `]` 与换行，允许内部空白：markdown-it 的 reference 规则本身接受含空格的
            // label（并会把连续空白折叠），若这里限成「不含任何空白」，`[^source 1]` + 同 label 定义
            // 就会绕过本规则、退回原生 shortcut reference，假链接照样出现。目标不是校验脚注 label，
            // 而是抢在 reference 之前保住 `[^...]` 原文。
            const footnoteRef = /^\[\^([^\]\r\n]+)\]/;
            md.inline.ruler.before('link', 'footnote_ref', function (state, silent) {
                if (state.src.charCodeAt(state.pos) !== 0x5B) return false;
                const match = footnoteRef.exec(state.src.slice(state.pos));
                if (!match) return false;
                if (!silent) {
                    const token = state.push('text', '', 0);
                    token.content = match[0];
                }
                state.pos += match[0].length;
                return true;
            });

            const footnoteDef = /^ {0,3}\[\^([^\]\r\n]+)\]:[ \t]*(.*)$/;
            md.block.ruler.before('reference', 'footnote_def', function (state, startLine, endLine, silent) {
                const start = state.bMarks[startLine] + state.tShift[startLine];
                const line = state.src.slice(start, state.eMarks[startLine]);
                if (!footnoteDef.test(line)) return false;
                if (silent) return true;
                const open = state.push('paragraph_open', 'p', 1);
                open.map = [startLine, startLine + 1];
                const inline = state.push('inline', '', 0);
                inline.content = line.trim();
                inline.map = [startLine, startLine + 1];
                inline.children = [];
                state.push('paragraph_close', 'p', -1);
                state.line = startLine + 1;
                return true;
            });

            // 任务列表：`- [ ]` / `- [x]` 默认只是纯文本（还挂着个圆点），这里换成主题化复选框
            const taskMarker = /^\[([ xX])\][ \t]+/;
            md.core.ruler.after('inline', 'task_list', function (state) {
                const tokens = state.tokens;
                for (let i = 0; i < tokens.length; i++) {
                    if (tokens[i].type !== 'inline') continue;
                    const itemOpen = tokens[i - 2];
                    if (!itemOpen || itemOpen.type !== 'list_item_open') continue;
                    if (!tokens[i - 1] || tokens[i - 1].type !== 'paragraph_open') continue;
                    const text = tokens[i].children[0];
                    if (!text || text.type !== 'text') continue;
                    const match = taskMarker.exec(text.content);
                    if (!match) continue;
                    const done = match[1].toLowerCase() === 'x';
                    itemOpen.attrJoin('class', done ? 'task-item is-done' : 'task-item');
                    text.content = text.content.slice(match[0].length);
                    const box = new state.Token('html_inline', '', 0);
                    box.content = done ? '<span class="task-box is-done"></span>' : '<span class="task-box"></span>';
                    tokens[i].children.unshift(box);
                }
            });

            // 将内容写入容器
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = md.render(rawData);

            // 初始化 Mermaid，配置超大字体以匹配我们的 24px 正文大小，避免重蹈 "修改JS" 的覆辙
            mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                themeVariables: {
                    fontFamily: 'Outfit, Nunito, PingFang SC, sans-serif',
                    fontSize: '20px',    // 直接在配置中覆盖字体大小
                    primaryColor: '#ffe5e7',
                    primaryTextColor: '#4a3735',
                    primaryBorderColor: '#ff8fa3',
                    lineColor: '#ff8fa3',
                    secondaryColor: '#fcd373',
                    tertiaryColor: '#e0ffff'
                }
            });

            // 渲染所有图表
            mermaid.run({ querySelector: '.mermaid' }).catch(e => console.error("Mermaid 渲染错误:", e)).finally(() => {
                // 延迟一下通知 Puppeteer 自适应截图容器高度
                setTimeout(() => {
                    const card = document.getElementById('render-card');
                    const container = document.getElementById('container');

                    // 如果内容过高，自动撑开（由于 CSS 已设置 min-height 和 height: auto，基本会自动撑开）
                    // 派发事件让 Puppeteer 如果有监听可以捕获
                    window.dispatchEvent(new CustomEvent('math-render-complete'));
                }, 200);
            });
        };
