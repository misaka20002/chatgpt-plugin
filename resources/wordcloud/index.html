<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WordCloud</title>
    <script src="{{pluResPath}}/wordcloud/js2wordcloud.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            /* 直接固定为目标输出尺寸 */
            width: 1280px;
            height: 960px;

            /* 可爱的粉色波点背景 - 根据新分辨率等比放大了波点 */
            background-color: #fff0f5;
            background-image: radial-gradient(#ffc0cb 15%, transparent 16%), radial-gradient(#ffc0cb 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            padding: 30px;
            font-family: "TsukuARdGothic-Regular", "ZCOOL KuaiLe", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 更加晶莹剔透的卡片设计 - 启用Flex布局 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 36px;
            /* 底部留稍微少一点的padding，让页脚更紧凑贴合 */
            padding: 30px 40px 20px 40px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.15), inset 0 0 30px rgba(255, 240, 245, 0.8);
            border: 5px solid #ffb6c1;

            /* 充满整个body减去padding的空间 */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部信息容器 */
        .header-container {
            text-align: center;
            margin-bottom: 10px;
        }

        /* 大标题 */
        .header-title {
            font-size: 44px;
            color: #ff6b8b;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #ffe4e1;
        }

        /* 时长与热度标签 */
        .header-info {
            display: inline-block;
            font-size: 24px;
            color: #ff7b9a;
            font-weight: bold;
            background: #fff5f7;
            padding: 10px 36px;
            border-radius: 40px;
            border: 2px dashed #ffb6c1;
            letter-spacing: 1px;
        }

        /* 词云包装器：使用 flex: 1 占据所有剩余空间 */
        .wordcloud-wrapper {
            flex: 1;
            width: 100%;
            margin-top: 20px;
            position: relative;
            min-height: 0;
            /* 必须，防止 flex 子元素溢出 */
        }

        /* 词云实际渲染容器 */
        #wordcloud2 {
            width: 100%;
            height: 100%;
        }

        /* 底部 Logo 页脚 */
        .logo {
            font-size: 20px;
            text-align: center;
            color: #ff9eaa;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px #fff;

            margin-top: auto;
            padding-top: 15px;
            /* 增加一条虚线分割线 */
            border-top: 2px dashed #ffe4e1;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header-container">
            <!-- 动态获取的标题 (带有群名/人名) -->
            <div class="header-title">{{title}}</div>
            <!-- 动态获取的时长和热度 -->
            <div class="header-info">
                ⏱️ 时长: {{durationText}} &nbsp;|&nbsp; 🌸 词汇热度: {{wordCount}}
            </div>
        </div>

        <!-- 词云区域直接占据卡片中央剩余位置 -->
        <div class="wordcloud-wrapper">
            <div id="wordcloud2"></div>
        </div>

        <!-- 页脚会自动被顶到底部 -->
        <div class="logo">🐾 Created By PaimonChatGPT-Plugin 🐾</div>
    </div>

    <script>
        let list = JSON.parse('{{@ list}}')
        var wc = new Js2WordCloud(document.getElementById('wordcloud2'))

        // 成五颜六色的马卡龙可爱糖果色系
        const cuteColorfulColors = [
            '#FF6B8B', '#FFB347', '#FFD700', '#85E3FF', '#B5EAD7',
            '#C7CEEA', '#FF9CEE', '#F28482', '#F6CA06', '#87CEEB',
            '#98D8C8', '#F4A261', '#E76F51', '#9D88B3', '#FFAEA5',
            '#A2D2FF', '#FFC8DD', '#FFAFCC', '#BDE0FE', '#CDB4DB',
            '#FF99C8', '#FCF6BD', '#D0F4DE', '#A9DEF9', '#E4C1F9'
        ];

        let len = list.length || 1;

        // 保留原有的系数乘积逻辑以适配大分辨率，但不再代表屏幕DPI黑魔法缩放，而是字号的基数倍率
        let scaleFactor = 2;
        // 词汇量在 80~100 时：动态最大字号约 140~158px，最小字号约 20~30px，刚好完美适应现在更大的容器
        let dynamicMax = Math.min(140, Math.max(70, 160 - len * 0.9)) * scaleFactor;
        let dynamicMin = Math.min(40, Math.max(12, 45 - len * 0.35)) * scaleFactor;
        let dynamicGrid = Math.min(12, Math.max(5, 16 - len * 0.1)) * scaleFactor;

        wc.setOption({
            tooltip: {
                show: false
            },
            list: list,
            shape: 'circle',
            gridSize: dynamicGrid,
            maxFontSize: dynamicMax,
            minFontSize: dynamicMin,
            shrinkToFit: true,
            color: function () {
                return cuteColorfulColors[Math.floor(Math.random() * cuteColorfulColors.length)];
            },
            backgroundColor: 'transparent',
            fontFamily: '"TsukuARdGothic-Regular", "ZCOOL KuaiLe", "Comic Sans MS", "PingFang SC", "Microsoft YaHei"'
        })
    </script>
</body>

</html>
