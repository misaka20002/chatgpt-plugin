<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Markmap 渲染</title>
    <style>
        /* 1. 梦幻糖果色网格渐变背景 */
        body {
            margin: 0;
            padding: 40px;
            background-color: #ffdde1;
            background-image:
                radial-gradient(at 40% 20%, hsla(28, 100%, 74%, 0.6) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 0.6) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355, 100%, 93%, 0.6) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340, 100%, 76%, 0.6) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22, 100%, 77%, 0.6) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242, 100%, 70%, 0.6) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343, 100%, 76%, 0.6) 0px, transparent 50%);
            font-family: "Nunito", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 2. Apple 风格高级玻璃拟态卡片容器 */
        .container {
            width: 1200px;
            height: 800px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 40px;
            padding: 40px 50px 30px 50px;
            box-shadow:
                0 50px 100px -20px rgba(50, 50, 93, 0.15),
                0 30px 60px -30px rgba(0, 0, 0, 0.1),
                inset 0 -2px 6px rgba(255, 255, 255, 0.4),
                inset 0 2px 6px rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
        }

        /* 3. 糖果色流光标题 */
        h1.title {
            text-align: center;
            font-size: 42px;
            /* 略微放大标题 */
            margin: 10px 0 20px 0;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(120deg, #ff7eb3 0%, #ff758c 40%, #8ca8fe 80%, #90e0ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(255, 126, 179, 0.2);
        }

        /* SVG 绘图区 */
        #markmap {
            width: 100%;
            flex: 1;
            overflow: visible;
        }

        /* 4. 页脚 */
        .footer {
            margin-top: auto;
            padding-top: 15px;
            font-size: 15px;
            color: #9aa0a6;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer::before {
            content: "✨";
            margin-right: 8px;
            font-size: 16px;
        }

        #markdown-data {
            display: none;
        }
    </style>

    <script src="{{pluResPath}}/markmap/d3.js"></script>
    <script src="{{pluResPath}}/markmap/markmap-lib.js"></script>
    <script src="{{pluResPath}}/markmap/markmap-view.js"></script>
</head>

<body>
    <div class="container">
        <h1 class="title">{{title}}</h1>
        <svg id="markmap"></svg>
        <div class="footer">Created By PaimonChatGPT-Plugin</div>
    </div>

    <div id="markdown-data">{{markdown}}</div>

    <script>
        window.onload = function () {
            const markdownContent = document.getElementById('markdown-data').innerText || document.getElementById('markdown-data').textContent;

            const { Transformer } = window.markmap;
            const transformer = new Transformer();
            const { root } = transformer.transform(markdownContent);

            const customColors = ['#FF6B6B', '#4ECDC4', '#FFD166', '#A06CD5', '#45B7D1', '#FF9F1C', '#96F550', '#F15BB5'];
            const colorFn = window.d3.scaleOrdinal(customColors);

            const { Markmap } = window.markmap;
            const svg = document.querySelector('#markmap');

            const mm = Markmap.create(svg, {
                autoFit: true,
                color: (node) => colorFn(node.state.path || node.state.key),
                nodeMinHeight: 45,
                spacingHorizontal: 120,
                spacingVertical: 38,
                paddingX: 25,
                style: (id) => `
                    ${id} * { font-family: "Nunito", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif !important; }
                    
                    /* 1. 线条加粗 */
                    ${id} path { 
                        stroke-width: 4px; 
                        stroke-linecap: round; 
                        stroke-linejoin: round; 
                        opacity: 0.9;
                    } 
                    
                    /* 2. 节点圆点同步放大 */
                    ${id} circle {
                        stroke-width: 3.5px;
                        r: 8;   /* 半径从 6.5 放大到 8，配合大字号更协调 */
                        fill: #ffffff !important; 
                    }
                    
                    /* 3. 【核心优化】正文字体大幅放大，提升清晰度与色彩对比度 */
                    ${id} text { 
                        font-size: 22px;    /* 字体大小从 16px 暴力提升至 22px */
                        font-weight: 700;   /* 保持粗体 */
                        fill: #1a1a1a;      /* 颜色由 #333 变深为 #1a1a1a，大大增加边缘锐利度与清晰度 */
                        text-shadow: 0 2px 5px rgba(0,0,0,0.08); /* 稍微增强投影，使文字更有立体感 */
                    }
                `
            }, root);

            setTimeout(() => {
                mm.fit();
            }, 600);
        };
    </script>
</body>

</html>
