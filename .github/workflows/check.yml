---
name: "check"

# 语法预检 + 快测试套件（内容见 package.json 的 check 脚本）
on:
  push:
    branches: [v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # pnpm 版本由 package.json 的 packageManager 字段决定（单一事实源；勿再传 version，两处并存会报 Multiple versions of pnpm specified）
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
