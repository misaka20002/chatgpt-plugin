name: "check"

# 语法预检 + 快测试套件（内容见 package.json 的 check 脚本）
on:
  push:
    branches: [v2]
  pull_request:

# 同一分支连续推送时只保留最新一次运行，旧的直接取消 ——
# 否则每次推送都会各发一封通知，改几个文件就连着收好几封。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # pnpm 版本由 package.json 的 packageManager 字段决定（单一事实源；勿再传 version，两处并存会报 Multiple versions of pnpm specified）
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 补齐测试依赖的宿主文件空壳。
      #
      # 插件按 Yunzai 的目录约定放在 <root>/plugins/chatgpt-plugin/，代码与测试里用
      # '../../../lib/...' 引宿主模块（plugin.js / loader.js / common.js / puppeteer.js）。
      # CI 的 checkout 直接落在 <work>/chatgpt-plugin/，上面两级没有 lib/，这些路径解析不到。
      # 测试虽然用 mock.module 打桩，但 Node 必须先「解析」目标路径才能打桩，解析不到
      # 就是 ERR_MODULE_NOT_FOUND。本地能过是因为 ../.. 恰好是 Yunzai 根目录、lib/ 真实存在。
      - name: 补宿主 lib 空壳（CI 无 lib/ 目录）
        run: |
          HOST_LIB="$GITHUB_WORKSPACE/../../lib"
          mkdir -p "$HOST_LIB/plugins" "$HOST_LIB/common" "$HOST_LIB/puppeteer"
          printf 'export default class plugin {}\n' > "$HOST_LIB/plugins/plugin.js"
          printf 'export const getBot = () => undefined\nexport const getPlatformInfo = () => ({ platform: "test" })\n' > "$HOST_LIB/plugins/loader.js"
          printf 'export const common = {}\nexport default {}\n' > "$HOST_LIB/common/common.js"
          printf 'export default class Puppeteer {}\n' > "$HOST_LIB/puppeteer/puppeteer.js"
      - run: pnpm run check
